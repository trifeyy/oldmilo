  <!-- MODAL CONTACTO -->
  <div class="dialog-overlay" id="contactOverlay">
    <div class="dialog">
      <button class="dialog-close" data-close aria-label="Cerrar">×</button>
      <h2 class="dialog-title">Contacto</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
        Escríbeme a mi correo oficial:
      </p>
      <div class="copy-box">
        <span id="copyText">contacto@oldmilo.xyz</span>
        <button class="copy-btn" id="copyBtn">Copiar</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Loader Holomórfico Animado
    window.addEventListener('DOMContentLoaded', () => {
      const percentText = document.getElementById('loaderPercent');
      const loader = document.getElementById('loader-screen');
      let currentProgress = 0;

      const duration = 1200; // 1.2 segundos de carga fluida
      const startTime = performance.now();

      function updateLoader(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Curva suave de animación
        const easeProgress = progress < 0.5 
          ? 2 * progress * progress 
          : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        currentProgress = Math.floor(easeProgress * 100);
        if (percentText) percentText.textContent = currentProgress;

        if (progress < 1) {
          requestAnimationFrame(updateLoader);
        } else {
          setTimeout(() => {
            loader.classList.add('hidden');
            document.body.classList.add('loaded');
          }, 200);
        }
      }

      requestAnimationFrame(updateLoader);
    });

    // 2. Partículas al mover el ratón
    let lastSparkleTime = 0;
    document.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastSparkleTime > 40) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = (e.clientX + (Math.random() * 10 - 5)) + 'px';
        sparkle.style.top = (e.clientY + (Math.random() * 10 - 5)) + 'px';
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 800);
        lastSparkleTime = now;
      }
    });

    // 3. Inclinación 3D
    const card = document.getElementById('tiltCard');
    if (card) {
      document.addEventListener('mousemove', (e) => {
        const { innerWidth, innerHeight } = window;
        const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
        const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);
        card.style.transform = `rotateX(${-y * 5}deg) rotateY(${x * 5}deg)`;
      });

      document.addEventListener('mouseleave', () => {
        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
      });
    }

    // 4. Control de Modales
    function setupModal(btnId, overlayId) {
      const btn = document.getElementById(btnId);
      const overlay = document.getElementById(overlayId);
      if(!btn || !overlay) return;
      btn.addEventListener('click', () => overlay.classList.add('open'));
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay || e.target.getAttribute('data-close') !== null) {
          overlay.classList.remove('open');
        }
      });
    }
    setupModal('moreBtn', 'moreOverlay');
    setupModal('contactBtn', 'contactOverlay');

    // 5. Copiar Correo
    const copyBtn = document.getElementById('copyBtn');
    if(copyBtn) {
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText('contacto@oldmilo.xyz').then(() => {
          copyBtn.textContent = '¡Copiado!';
          setTimeout(() => {
            copyBtn.textContent = 'Copiar';
          }, 2000);
        });
      });
    }
  </script>
