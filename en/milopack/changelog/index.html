  <script>
    document.documentElement.classList.add('js');
    try {
      if (sessionStorage.getItem('om-visited') || matchMedia('(prefers-reduced-motion: reduce)').matches)
        document.documentElement.classList.add('no-loader');
    } catch (e) { document.documentElement.classList.add('no-loader'); }
    try {
      const c = localStorage.getItem('om-accent');
      if (c && /^\d{1,3}, \d{1,3}, \d{1,3}$/.test(c)) {
        document.documentElement.style.setProperty('--accent', `rgb(${c})`);
        document.documentElement.style.setProperty('--accent-rgb', c);
      }
    } catch (e) { }
    try {
      const p = localStorage.getItem('om-lang');
      if (p && p !== document.documentElement.lang) {
        const alt = document.querySelector(`link[rel="alternate"][hreflang="${p}"]`);
        if (alt) location.replace(new URL(alt.href).pathname + location.hash);
      }
    } catch (e) { }
  </script>
